services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  load:
    build:
      context: .
      dockerfile: db/Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: api/Dockerfile.test
    profiles: ["tools"]
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  lint:
    build:
      context: .
      dockerfile: Dockerfile.lint
    profiles: ["tools"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
      AGENT_MAX_TOOL_RETRIES: ${AGENT_MAX_TOOL_RETRIES:-2}
      AGENT_ROW_CAP: ${AGENT_ROW_CAP:-1000}
      AGENT_QUERY_TIMEOUT_MS: ${AGENT_QUERY_TIMEOUT_MS:-5000}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      AGENT_DB_POOL_MIN_SIZE: ${AGENT_DB_POOL_MIN_SIZE:-1}
      AGENT_DB_POOL_MAX_SIZE: ${AGENT_DB_POOL_MAX_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Browser-facing origin of the frontend (see frontend/Dockerfile) --
      # this is what CORS checks against, not a container-network address.
      # PUBLIC_HOST defaults to localhost but is the one thing to override
      # (e.g. a Tailscale IP) when the browser isn't on the same machine
      # as Docker -- see PUBLIC_HOST's own comment below.
      FRONTEND_ORIGIN: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Browser-facing address of the API -- the user's browser calls this
      # directly, not through the compose network, so it has to be
      # PUBLIC_HOST:<published port>, not http://api:8000.
      API_BASE_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000')"]
      interval: 10s
      timeout: 5s
      retries: 5

  eval:
    build:
      context: .
      dockerfile: eval/Dockerfile
    profiles: ["tools"]
    environment:
      EVAL_API_BASE_URL: http://api:8000
      EVAL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Results need to land somewhere that survives this throwaway
      # container exiting -- host bind mount, not a named volume, so
      # they're just files you can open directly afterward.
      - ./eval/results:/app/results
    depends_on:
      api:
        condition: service_healthy

  loadtest-chat:
    image: grafana/k6:latest
    profiles: ["tools"]
    # grafana/k6's own image runs as its own non-root user internally,
    # which doesn't own the bind-mounted ./loadtest/results on the host --
    # pinned to uid 1000 (this repo's convention everywhere else too --
    # see api/Dockerfile's appuser) so the summary-export write succeeds
    # instead of failing with permission denied.
    user: "1000:1000"
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./loadtest:/scripts
      - ./loadtest/results:/results
    depends_on:
      api:
        condition: service_healthy
    command: run --summary-export=/results/chat_summary.json /scripts/chat.js

  loadtest-artifacts:
    image: grafana/k6:latest
    profiles: ["tools"]
    user: "1000:1000"
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./loadtest:/scripts
      - ./loadtest/results:/results
    depends_on:
      api:
        condition: service_healthy
    command: run --summary-export=/results/artifacts_summary.json /scripts/artifacts.js

volumes:
  pgdata:
