<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Analytics</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="app-header">
    <h1>Discord Analytics</h1>
  </header>
  <div id="app"></div>

  <script>
    // Overridable at container start (see Dockerfile/entrypoint) without a
    // build step -- config.js is generated from an env var when the
    // frontend container starts, and only falls back to this default if
    // that file is missing (e.g. running index.html directly, no server).
    window.API_BASE_URL = window.API_BASE_URL || "http://localhost:8000";
  </script>
  <script src="config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/artifact.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
